<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الإشعارات</title>
<style>
  :root {
    --bg: #f3f5f4; --surface: #fff; --ink: #17211d; --muted: #5d6b65;
    --line: #dde3e0; --accent: #1f6f5c; --accent-ink: #fff;
    --ok: #17724a; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101614; --surface: #18211e; --ink: #e8efec; --muted: #9aaaa3;
      --line: #28332f; --accent: #4fb89d; --accent-ink: #08130f;
      --ok: #5fd39b; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6;
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", system-ui, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 20px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 1rem; margin: 0 0 12px; }
  label { display: block; font-size: .9rem; margin: 12px 0 4px; color: var(--muted); }
  input, textarea {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  input[dir="ltr"], textarea[dir="ltr"] { text-align: left; }
  textarea { min-height: 96px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; padding: 11px 18px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  button.primary {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    width: 100%; margin-top: 18px; font-weight: 600;
  }
  button:disabled { opacity: .55; cursor: wait; }
  .hint { font-size: .8rem; color: var(--muted); margin-top: 4px; }
  #status { margin-top: 14px; font-size: .92rem; white-space: pre-wrap; word-break: break-word; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  #curlBox { display: none; margin-top: 12px; }
  #curlBox textarea { min-height: 120px; font-family: ui-monospace, Consolas, monospace; font-size: .78rem; }
</style>
</head>
<body>
<main>
  <h1>إرسال إشعار</h1>

  <section class="card">
    <h2>الربط مع OneSignal</h2>
    <label for="appId">App ID</label>
    <input id="appId" dir="ltr" autocomplete="off" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
    <label for="apiKey">REST API Key</label>
    <input id="apiKey" type="password" dir="ltr" autocomplete="off" placeholder="Key من Settings &gt; Keys &amp; IDs">
    <div style="display:flex;gap:8px;margin-top:14px">
      <button type="button" id="saveKeys">حفظ المفاتيح</button>
      <button type="button" id="clearKeys">مسح المفاتيح</button>
    </div>
    <div class="hint" id="keysHint">المفاتيح بتتحفظ في متصفحك أنت بس (localStorage) ومش بتتكتب في الملف.</div>
  </section>

  <section class="card">
    <h2>الرسالة</h2>
    <label for="title">العنوان</label>
    <input id="title" maxlength="100" placeholder="كورس جديد">
    <label for="msg">النص</label>
    <textarea id="msg" maxlength="500" placeholder="اكتب نص الإشعار"></textarea>
    <label for="url">الرابط عند الضغط (اختياري)</label>
    <input id="url" dir="ltr" placeholder="https://example.com/">
    <label for="img">صورة كبيرة (اختياري، Chrome فقط)</label>
    <input id="img" dir="ltr" placeholder="https://example.com/image.jpg">
    <button class="primary" id="send" type="button">إرسال لكل المشتركين</button>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="curlBox">
      <label for="curl">لو المتصفح منع الطلب، شغّل الأمر ده من الترمنال:</label>
      <textarea id="curl" dir="ltr" readonly></textarea>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const API = "https://api.onesignal.com/notifications";

  // استرجاع القيم المحفوظة
  try {
    $("appId").value = localStorage.getItem("os_app_id") || "";
    $("apiKey").value = localStorage.getItem("os_rest_key") || sessionStorage.getItem("os_rest_key") || "";
  } catch (e) {}

  $("saveKeys").addEventListener("click", () => {
    try {
      localStorage.setItem("os_app_id", $("appId").value.trim());
      localStorage.setItem("os_rest_key", $("apiKey").value.trim());
      $("keysHint").textContent = "اتحفظت المفاتيح في المتصفح ده.";
    } catch (e) {
      $("keysHint").textContent = "المتصفح منع الحفظ.";
    }
  });
  $("clearKeys").addEventListener("click", () => {
    try {
      localStorage.removeItem("os_app_id");
      localStorage.removeItem("os_rest_key");
      sessionStorage.removeItem("os_rest_key");
    } catch (e) {}
    $("appId").value = "";
    $("apiKey").value = "";
    $("keysHint").textContent = "اتمسحت المفاتيح.";
  });

  function setStatus(text, kind) {
    const s = $("status");
    s.textContent = text;
    s.className = kind || "";
  }

  function buildPayload() {
    const p = {
      app_id: $("appId").value.trim(),
      target_channel: "push",
      included_segments: ["Subscribed Users"],
      headings: { en: $("title").value.trim() },
      contents: { en: $("msg").value.trim() },
      idempotency_key: crypto.randomUUID()
    };
    if (!p.headings.en) delete p.headings;   // لو فاضي بيستخدم اسم الموقع
    const url = $("url").value.trim();
    const img = $("img").value.trim();
    if (url) p.url = url;
    if (img) p.chrome_web_image = img;
    return p;
  }

  function curlFor(payload, key) {
    return "curl -X POST '" + API + "' \\\n" +
      "  -H 'Content-Type: application/json; charset=utf-8' \\\n" +
      "  -H 'Authorization: Key " + key + "' \\\n" +
      "  -d '" + JSON.stringify(payload).replace(/'/g, "'\\''") + "'";
  }

  $("send").addEventListener("click", async () => {
    const key = $("apiKey").value.trim();
    const payload = buildPayload();
    $("curlBox").style.display = "none";

    if (!payload.app_id || !key) return setStatus("اكتب الـ App ID والـ REST API Key.", "err");
    if (!payload.contents.en) return setStatus("اكتب نص الإشعار.", "err");

    try {
      localStorage.setItem("os_app_id", payload.app_id);
      sessionStorage.setItem("os_rest_key", key);
    } catch (e) {}

    const btn = $("send");
    btn.disabled = true;
    setStatus("جاري الإرسال...");

    try {
      const res = await fetch(API, {
        method: "POST",
        headers: {
          "Content-Type": "application/json; charset=utf-8",
          "Authorization": "Key " + key
        },
        body: JSON.stringify(payload)
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}

      if (!res.ok) {
        const reason = (data.errors && data.errors.join ? data.errors.join(" | ") : "") || ("HTTP " + res.status);
        setStatus("فشل الإرسال: " + reason, "err");
      } else if (!data.id) {
        // 200 بدون id = الطلب سليم لكن مفيش مشتركين يستقبلوا
        const reason = data.errors && data.errors.join ? data.errors.join(" | ") : "";
        setStatus("ما اتبعتش: مفيش مشتركين مفعّلين حاليًا. " + reason, "err");
      } else {
        setStatus("اتبعت بنجاح. رقم الإشعار: " + data.id, "ok");
      }
    } catch (e) {
      // غالبًا CORS أو انقطاع نت
      setStatus("المتصفح مقدرش يوصل لـ OneSignal من الصفحة دي (غالبًا قيود CORS أو النت). استخدم الأمر اللي تحت.", "err");
      $("curl").value = curlFor(payload, key);
      $("curlBox").style.display = "block";
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
