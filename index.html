<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدورات</title>

<!-- OneSignal Web SDK v16 (Custom Code setup) -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  // ===== وضع التشخيص: غيّر true إلى false لما تخلص =====
  const DEBUG = true;
  const APP_ID = "faea3b18-7574-45a6-96f1-dbe1b484017f";
  let sdkReady = false;
  function dbg(t) {
    if (!DEBUG) return;
    const e = document.getElementById("dbg");
    if (e) e.textContent += t + "\n";
  }
  window.addEventListener("error", (ev) => dbg("✖ خطأ في الصفحة: " + ev.message));
  window.addEventListener("unhandledrejection", (ev) => dbg("✖ خطأ: " + ((ev.reason && ev.reason.message) || ev.reason)));
  window.addEventListener("load", () => {
    dbg("1) الصفحة اتحمّلت: " + location.href);
    setTimeout(() => {
      if (!sdkReady) dbg("✖ الـ SDK ما اتحمّلش بعد 5 ثواني (cdn.onesignal.com متحجب أو بطيء)");
    }, 5000);
  });

  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    sdkReady = true;
    dbg("2) ✔ الـ SDK اتحمّل");
    try {
      await OneSignal.init({
        appId: APP_ID,
        serviceWorkerPath: "VV/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/VV/" },
        autoResubscribe: true,
        welcomeNotification: { disable: true },
      });
      dbg("3) ✔ init تمام");
    } catch (e) {
      dbg("3) ✖ init فشل: " + ((e && e.message) || e));
      return;
    }

    if (!OneSignal.Notifications.isPushSupported()) {
      dbg("✖ المتصفح ده مش بيدعم الإشعارات (أو أنت في Incognito/Guest)");
      return;
    }
    dbg("4) إذن الإشعارات الحالي: " + Notification.permission);

    const ask = () => {
      if (Notification.permission === "default") {
        dbg("5) باطلب الإذن...");
        OneSignal.Notifications.requestPermission();
      }
    };
    ask();
    const once = () => {
      ["pointerdown", "keydown"].forEach((ev) => removeEventListener(ev, once, true));
      ask();
    };
    ["pointerdown", "keydown"].forEach((ev) => addEventListener(ev, once, true));

    OneSignal.Notifications.addEventListener("permissionChange", (p) => dbg("6) الإذن بقى: " + p));
    OneSignal.User.PushSubscription.addEventListener("change", (e) =>
      dbg("7) الاشتراك: id=" + (e.current.id || "-") + " optedIn=" + e.current.optedIn));
  });
</script>

<style>
  :root {
    --bg: #f3f5f4;
    --surface: #ffffff;
    --ink: #17211d;
    --muted: #5d6b65;
    --line: #dde3e0;
    --accent: #1f6f5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101614;
      --surface: #18211e;
      --ink: #e8efec;
      --muted: #9aaaa3;
      --line: #28332f;
      --accent: #4fb89d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", system-ui, sans-serif;
    line-height: 1.7;
    min-height: 100vh;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px;
  }
  h1 { font-size: 1.6rem; margin: 0 0 24px; }
  .course {
    display: flex;
    gap: 16px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    max-width: 420px;
  }
  .thumb {
    flex: none;
    width: 84px;
    height: 84px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 2rem;
  }
  .course h2 { font-size: 1.05rem; margin: 0 0 4px; }
  .course p { margin: 0; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
  <main>
    <h1>الدورات</h1>
    <article class="course">
      <div class="thumb" aria-hidden="true">▶</div>
      <div>
        <h2>اسم الكورس</h2>
        <p>وصف مختصر للكورس يظهر هنا.</p>
      </div>
    </article>
  </main>
  <pre id="dbg" style="max-width:720px;margin:0 auto;padding:12px 20px;white-space:pre-wrap;font:13px/1.8 monospace;color:#9aaaa3;direction:rtl;text-align:right"></pre>
</body>
</html>
